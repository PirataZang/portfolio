# ─────────────────────────────────────────────────────────────────────────────
# A cobrinha que come os commits.
#
# Onde este arquivo mora: no repositório de perfil PirataZang/PirataZang,
# no caminho  .github/workflows/snake.yml
#
# Ele gera os dois SVGs (claro e escuro) e publica na branch `output`, que é
# de onde o README lê. Roda de 12 em 12 horas e dá para disparar na mão pela
# aba Actions (workflow_dispatch) logo depois de criar, para não esperar.
# ─────────────────────────────────────────────────────────────────────────────
name: Cobrinha das contribuições

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  gerar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Gera os SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # as cores acompanham a paleta do README: roxo e ciano
          outputs: |
            dist/github-snake.svg?color_snake=#8b2fff&color_dots=#e8e4f5,#c9b6f0,#a259f7,#7c2ee0,#5b2ec4
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00e0ff&color_dots=#0a0c17,#2a1f4d,#5b2ec4,#8b2fff,#a259f7

      - name: Publica na branch output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
