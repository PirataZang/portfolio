<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <!--
    Ladrilho de formatos de massa, usado como background-image nas faixas de
    cor. É um arquivo em vez de data URI para continuar editável: mexer
    numa massa aqui é mexer numa massa, não num %3C.
  -->
  <g fill="none" stroke="#7a4a2c" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <!-- penne rigate -->
    <g transform="translate(34 30) rotate(-32)">
      <path d="M-8 -13 L-1 -20 A7 7 0 0 1 8 -13 L8 13 L1 20 A7 7 0 0 1 -8 13 Z" />
      <path d="M-4 -16 L-4 17 M0 -18 L0 19 M4 -17 L4 18" stroke-width="1.1" />
    </g>

    <!-- farfalle -->
    <g transform="translate(126 44) rotate(12)">
      <path d="M-3 0 L-18 -12 Q-21 0 -18 12 Z" />
      <path d="M3 0 L18 -12 Q21 0 18 12 Z" />
      <path d="M-3 -5 Q0 0 -3 5 M3 -5 Q0 0 3 5" stroke-width="1.1" />
    </g>

    <!-- fusilli -->
    <g transform="translate(52 118) rotate(18)">
      <path d="M0 -22 Q10 -17 0 -12 Q-10 -7 0 -2 Q10 3 0 8 Q-10 13 0 18 Q6 20 8 22" />
      <path d="M-6 -20 Q4 -15 -6 -10 Q-16 -5 -6 0 Q4 5 -6 10 Q-16 15 -6 20" stroke-width="1.1" opacity="0.6" />
    </g>

    <!-- conchiglie -->
    <g transform="translate(136 128) rotate(-14)">
      <path d="M-13 6 Q-13 -12 0 -12 Q13 -12 13 6 Q6 12 0 10 Q-6 12 -13 6 Z" />
      <path d="M-8 8 Q-7 -6 -3 -11 M0 10 L0 -12 M8 8 Q7 -6 3 -11" stroke-width="1.1" />
    </g>

    <!-- spaghetti soltos, ligando o ladrilho de um lado ao outro -->
    <path d="M-10 78 Q45 66 90 80 Q135 94 190 80" stroke-width="1.3" opacity="0.75" />
    <path d="M-10 88 Q45 76 90 90 Q135 104 190 90" stroke-width="1.3" opacity="0.55" />
  </g>
</svg>
