services:
  dev:
    profiles: [dev]
    build:
      context: .
      target: dev
    ports:
      - "4322:4322"
    volumes:
      - .:/app
      - /app/node_modules # keep the image's node_modules, not the host's

  prod:
    profiles: [prod]
    build:
      context: .
      target: prod
    ports:
      - "8080:80"
